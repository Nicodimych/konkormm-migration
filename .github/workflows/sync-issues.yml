name: Синхронизация Issues в QUESTIONS.md

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync-issue-to-questions:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4
        
      - name: Получить данные Issue
        id: issue
        run: |
          echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          echo "ISSUE_TITLE=${{ github.event.issue.title }}" >> $GITHUB_OUTPUT
          echo "ISSUE_BODY<<EOF" >> $GITHUB_OUTPUT
          echo "${{ github.event.issue.body }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "ISSUE_AUTHOR=${{ github.event.issue.user.login }}" >> $GITHUB_OUTPUT
          
      - name: Добавить вопрос в QUESTIONS.md
        run: |
          # Добавляем вопрос в конец файла
          echo "" >> QUESTIONS.md
          echo "---" >> QUESTIONS.md
          echo "" >> QUESTIONS.md
          echo "### ❓ ${{ github.event.issue.number }}. ${{ github.event.issue.title }}" >> QUESTIONS.md
          echo "" >> QUESTIONS.md
          echo "**Автор:** @${{ github.event.issue.user.login }}" >> QUESTIONS.md
          echo "**Вопрос:**" >> QUESTIONS.md
          echo "" >> QUESTIONS.md
          echo "${{ github.event.issue.body }}" >> QUESTIONS.md
          echo "" >> QUESTIONS.md
          echo "**Статус:** ⏳ Ожидание ответа" >> QUESTIONS.md
          echo "**Дедлайн:** TBD" >> QUESTIONS.md
          echo "**GitHub Issue:** #${{ github.event.issue.number }}" >> QUESTIONS.md
          echo "" >> QUESTIONS.md
          echo "**Ответ:**" >> QUESTIONS.md
          echo "_Здесь появится ответ от AI-консультанта и команды_" >> QUESTIONS.md
          echo "" >> QUESTIONS.md
          
      - name: Закоммитить изменения
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add QUESTIONS.md
          git commit -m "Автоматически добавлен вопрос #${{ github.event.issue.number }} из Issue"
          git push
          
      - name: Добавить комментарий в Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Ваш вопрос автоматически добавлен в файл QUESTIONS.md.\n\nОтвет появится в ближайшее время (обычно в течение нескольких часов) и будет виден:\n- В этом Issue\n- В файле QUESTIONS.md на GitHub\n\n📖 Отслеживать: https://github.com/Nicodimych/konkormm-migration/blob/master/QUESTIONS.md'
            })

